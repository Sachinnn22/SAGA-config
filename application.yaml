eureka:
  client:
    service-url:
      defaultZone: http://vm-node-a.platform:8761/eureka,http://vm-node-b.platform:8761/eureka,http://vm-node-c.platform:8761/eureka

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.example: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

jwt:
  secret: MySuperDuperSecretKeyForJwtAuthenticationWhichIsVeryLongAndSecure123456
  expiration: 900000
  refresh-expiration: 604800000