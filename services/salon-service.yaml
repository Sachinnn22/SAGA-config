server:
  port: 0
  forward-headers-strategy: framework

spring:
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/salon_db
    username: postgres
    password: sachi17953
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    inetutils:
      preferred-networks:
        - 10.
        - 192.168.

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  instance:
    prefer-ip-address: true
    # using Service Name and Random UUID to create a unique Instance ID - for port is dynamic ( it means port = 0 )
    instance-id: ${spring.application.name}:${random.value}