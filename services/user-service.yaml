server:
  port: 0
  forward-headers-strategy: framework

spring:
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: sachi17953
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: a-very-secure-jwt-secret-key-that-should-be-at-least-256-bits-long
  expiration: 900000
  refresh-expiration: 604800000

eureka:
  instance:
    prefer-ip-address: true
    # using Service Name and Random UUID to create a unique Instance ID - for port is dynamic ( it means port = 0 )
    instance-id: ${spring.application.name}:${random.value}