server:
  port: 8084

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      # ==============================
      # Eureka Service Discovery
      # ==============================
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # ==============================
      # API Gateway Routes
      # ==============================
      routes:

        # ------------------------------
        # User Service
        # ------------------------------
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**

        # ------------------------------
        # Salon Service
        # ------------------------------
        - id: salon-service
          uri: lb://SALON-SERVICE
          predicates:
            - Path=/api/v1/salons/**

        # ------------------------------
        # Appointment Service
        # ------------------------------
        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/api/v1/appointments/**

      # ==============================
      # Global Filters
      # ==============================
      default-filters:
        - PreserveHostHeader
        - AuthenticationFilter

      # ==============================
      # CORS Configuration
      # ==============================
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

# ==================================
# Eureka
# ==================================
eureka:
  instance:
    prefer-ip-address: true

# ==================================
# Actuator
# ==================================
management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      access: unrestricted